<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' data: http: https:; style-src 'self'; script-src 'self'"
    />
    <title>Saya</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="addrload.css" />
  </head>
  <body>
    <div id="stage"></div>

    <!-- Mode "top": baris tab di atas (tabzone dipindah ke sini oleh renderer.js) -->
    <header id="tabbar"></header>

    <header id="topbar">
      <div class="side left">
        <img id="brand" alt="" draggable="false" hidden />
        <button
          id="sidebar-toggle"
          class="icon-btn"
          title="Toggle sidebar (Ctrl+Shift+B)"
        >
          <svg viewBox="0 0 16 16">
            <rect x="2" y="3" width="12" height="10" rx="2.5" />
            <path d="M6 3v10" />
          </svg>
        </button>
        <button id="back" class="icon-btn" title="Back (Alt+Left)" disabled>
          <svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5" /></svg>
        </button>
        <button
          id="forward"
          class="icon-btn"
          title="Forward (Alt+Right)"
          disabled
        >
          <svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" /></svg>
        </button>
        <button id="reload" class="icon-btn" title="Reload (F5)">
          <svg viewBox="0 0 16 16">
            <path d="M11.5 4.5A5 5 0 1 0 13 8" />
            <path d="M12.5 1.8v3.2H9.3" />
          </svg>
        </button>
      </div>

      <div id="addrbox">
        <button
          id="site"
          class="icon-btn"
          title="Site info &amp; permissions"
          disabled
        >
          <svg viewBox="0 0 16 16">
            <path d="M2.5 5h6M11.5 5h2M2.5 11h2M7.5 11h6" />
            <circle cx="10" cy="5" r="1.5" />
            <circle cx="6" cy="11" r="1.5" />
          </svg>
        </button>
        <button id="address" type="button" title="Search or enter address (Ctrl+L)">
          <span id="addr-text">Search or enter address</span>
        </button>
        <!-- Indikator loading halus; hanya tampil saat tab memuat, mode sidebar, dan sidebar tidak di-pin (lihat addrload.css) -->
        <span id="addr-load" aria-hidden="true"></span>
      </div>

      <div class="side right">
        <button
          id="star"
          class="icon-btn"
          title="Add bookmark (Ctrl+D)"
          disabled
        >
          <svg viewBox="0 0 16 16">
            <path
              d="M8 1.9l1.9 3.8 4.2.6-3 3 .7 4.2L8 11.5l-3.8 2 .7-4.2-3-3 4.2-.6z"
            />
          </svg>
        </button>
        <button id="adblock" class="icon-btn wide" title="Ad blocker" disabled>
          <svg viewBox="0 0 16 16">
            <path
              d="M8 1.8l5 1.8v4c0 3-2.1 5.2-5 6.4-2.9-1.2-5-3.4-5-6.4v-4z"
            />
          </svg>
          <span id="adblock-count"></span>
        </button>
        <button id="downloads" class="icon-btn" title="Downloads (Ctrl+J)">
          <svg viewBox="0 0 16 16">
            <path d="M8 2.5v7M5 6.8l3 3 3-3M3 12.5h10" />
          </svg>
        </button>
        <button id="menu" class="icon-btn" title="Menu">
          <svg viewBox="0 0 16 16" class="dots">
            <circle cx="3.5" cy="8" r="1.1" />
            <circle cx="8" cy="8" r="1.1" />
            <circle cx="12.5" cy="8" r="1.1" />
          </svg>
        </button>
      </div>
    </header>

    <aside id="sidebar">
     <div id="tabzone">
      <div id="tabs"></div>
      <!-- Tepat di bawah tab terakhir; #tabs setinggi isinya dan baru menggulir saat ruang habis -->
      <button id="new-tab" title="New tab (Ctrl+T)">
        <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" /></svg>
        <span>New Tab</span>
      </button>
     </div>
    </aside>

    <!-- Tepi kiri: kursor di sini membuka sidebar yang tersembunyi -->
    <div id="hot"></div>

    <!-- Handle resize sidebar (di celah antara sidebar dan halaman; hanya aktif saat sidebar di-pin) -->
    <div id="sb-resize" title="Drag to resize, double-click to collapse/expand"></div>

    <script src="renderer.js"></script>
  </body>
</html>
